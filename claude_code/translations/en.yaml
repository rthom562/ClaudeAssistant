configuration:
  claude_config_access:
    name: Claude Code access to /config
    description: >-
      read_only (default): Claude Code's file-editing tools are denied for
      /config. read_write: Claude Code may edit /config, but every change
      still asks for your approval. This is a Claude Code guardrail; for a
      filesystem-level read-only mount see the documentation.
  protect_secrets:
    name: Protect secrets
    description: >-
      Deny Claude Code's Read tools access to secrets.yaml, HA auth storage
      and Nabu Casa cloud files.
  backup_before_edit:
    name: Back up files before Claude edits them
    description: >-
      Copy each /config file to /data/backups/config/<timestamp>/ right before
      a Claude Code edit tool changes it.
  backup_retention_days:
    name: Backup retention (days)
    description: Pre-edit backups older than this are deleted at app start.
  auto_update_claude:
    name: Auto-update Claude Code
    description: >-
      Let Claude Code update itself in persistent storage. When off, update
      manually with "claude update".
  skip_permissions:
    name: Skip permission prompts in tabs
    description: >-
      New and Resume tabs start Claude Code with
      --dangerously-skip-permissions: it edits files and runs commands
      without asking. Deny rules (read_only, .storage, secrets) still apply.
      Turn off to be asked before each action.
  remote_control:
    name: Remote Control
    description: >-
      Start tabs with --remote-control so each session can also be used from
      claude.ai/code or the Claude mobile app.
  phone_url:
    name: Remote address for the phone QR code
    description: >-
      Optional. Your Home Assistant Cloud (Nabu Casa) URL, for example
      https://abc123.ui.nabu.casa, so the "Open on your phone" QR code works
      away from home.
  terminal_font_size:
    name: Terminal font size
    description: >-
      Starting font size. The tab bar normally fits the text to the window
      (Auto) and has A-/A+ buttons.
  ssh_enabled:
    name: Enable SSH
    description: Start the SSH server (requires at least one authorized key).
  authorized_keys:
    name: Authorized SSH public keys
    description: >-
      One public key per entry (for example "ssh-ed25519 AAAA... me@laptop").
      Password login is always disabled.
  ssh_allow_forwarding:
    name: Allow SSH forwarding
    description: >-
      Allow TCP and agent forwarding (needed by VS Code Remote-SSH). Off by
      default.
  git_user_name:
    name: Git user name
    description: Optional name for git commits.
  git_user_email:
    name: Git user email
    description: Optional email for git commits.
network:
  22/tcp: SSH port (key authentication only; use on your local network)

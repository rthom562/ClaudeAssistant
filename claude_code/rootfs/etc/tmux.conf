# tmux configuration for the Claude Code app.
# Every browser tab is its own tmux session (named cc-xxxxxxxxxx). Closing the
# browser does not stop it. From SSH: "tmux ls", then "tmux attach -t <name>".

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g default-shell /bin/bash

# Fast Escape key (Claude Code uses Esc to interrupt).
set -sg escape-time 10
set -g extended-keys on

# Resize to whichever client (browser or SSH) was used most recently.
set -g window-size latest
setw -g aggressive-resize on

# Scroll back with the mouse wheel. Hold Shift to select/copy text with the
# browser's native selection.
set -g mouse on
set -g history-limit 50000
set -g set-clipboard on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g status-style "bg=colour236,fg=colour250"
set -g status-left "#[bold] Claude Code #[default]| "
set -g status-left-length 20
set -g status-right "#{session_name}  %H:%M "

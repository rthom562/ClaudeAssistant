# Ingress front end for ttyd.
#
# Home Assistant Ingress: the Supervisor authenticates the user's HA session
# (admin only, see panel_admin in config.yaml), strips the
# /api/hassio_ingress/<token>/ prefix and forwards the request from
# 172.30.32.2 to this server. Every other source address is refused, so other
# containers on the internal hassio network cannot reach the terminal.

user www-data;
worker_processes 1;
pid /run/nginx.pid;
daemon off;
error_log stderr warn;

events {
    worker_connections 64;
}

http {
    access_log off;          # no request logging (no session data in logs)
    server_tokens off;
    client_max_body_size 1m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8099 default_server;

        allow 172.30.32.2;   # Home Assistant Supervisor (Ingress proxy)
        allow 127.0.0.1;     # Docker HEALTHCHECK inside the container
        deny  all;

        # Tab bar page (static).
        location = / {
            root /usr/share/claude-code-ha/www;
            try_files /index.html =404;
            default_type text/html;
            add_header Cache-Control "no-store";
        }

        # Tab service (list / create / close sessions).
        location /api/ {
            proxy_pass http://127.0.0.1:7682;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 30s;
        }

        # ttyd: one WebSocket per tab. The /terminal/ prefix is stripped.
        location /terminal/ {
            proxy_pass http://127.0.0.1:7681/;
            proxy_http_version 1.1;

            # WebSocket upgrade for the terminal stream.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Long-lived interactive sessions; ttyd pings every 30 s.
            proxy_read_timeout 1d;
            proxy_send_timeout 1d;
            proxy_buffering off;
        }

        location / {
            return 404;
        }
    }
}
